<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Flow Whitewater Rafting</title>
    <meta name="description" content="Contact Flow Whitewater Rafting to book your next adventure, ask questions about our trips, or get in touch with our team.">
    <meta name="author" content="Nathalia Rocha">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/flow-logo.png" alt="Flow whitewater rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

<main>
        <h1>Contact Us | Flow Whitewater Rafting</h1>
        
        <section class="company-info">
            <h2>Flow Whitewater Rafting</h2>
            <address>
                <p>R. Princesa Leopoldina, 1900<br>
                Santo Amaro, SC<br>
                +1 555 0123 109<br>
                <a href="mailto:info@flow.com">info@flow.com</a></p>
            </address>
        </section>

        <div class="contact-grid">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d113018.5835970102!2d-48.915773750553996!3d-27.722511897262425!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9520c968a3831475%3A0xd976a3f880af8612!2sApuama%20Rafting%20Grande%20Florian%C3%B3polis!5e0!3m2!1spt-BR!2sbr!4v1791554127407!5m2!1spt-BR!2sbr" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

             <section class="contact-form">
                <form action="#" method="get">
                    <div class="name">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your name" required>
                    </div>

                    <div class="email">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your best email" required>
                    </div>

                    <div class="radio-group">
                        <p>Message<br>Purpose</p>
                        <label><input type="radio" id="general" name="purpose" value="general" checked> General Inquiry</label>
                        <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
                        <label><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
                    </div>

                    <div class="message">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type your message" required></textarea>
                    </div>

                    <div class="checkbox">
                        <label>
                            <input type="checkbox" id="subscribe" name="newsletter" value="subscribe"> Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </section>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee">
                <figure>
                    <img src="images/employee1.jpg" alt="Profile picture of a river guide">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Profile picture of a trip coordinator">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Profile picture of a safety manager">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>
    
    <footer>
        <p>©️ 2026 | Flow Whitewater Rafting | Nathalia Rocha</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram icon">
            </a>
        </nav>
    </footer>
</body>

</html>
